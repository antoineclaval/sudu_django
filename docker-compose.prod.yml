services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    command: gunicorn sudu.wsgi:application --bind 0.0.0.0:8000 --timeout 600
    volumes:
      - static_files:/home/app/web/staticfiles
      - media_files:/home/app/web/mediafiles
    expose:
      - 8000
    env_file:
      - ./.env.prod
    depends_on:
      - db
  db:
    image: docker.io/postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod.db
  nginx:
    build: ./nginx
    volumes:
      - static_files:/home/app/web/staticfiles
      - media_files:/home/app/web/mediafiles
    ports:
      - 80:80
    depends_on:
      - web

volumes:
  postgres_data:
  static_files:
  media_files:
